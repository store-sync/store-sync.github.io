name: Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    name: Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check authorized user
        run: |
          echo "Workflow triggered by: ${{ github.actor }}"

          if [ "${{ github.actor }}" != "store-sync" ]; then
            echo "❌ You are not authorized to run the Production pipeline."
            exit 1
          fi

          echo "✅ Authorized user."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vue project
        run: npm run build

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d').${{ github.run_number }}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Generated version: $VERSION"

      - name: Create and push version tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Production release ${{ steps.version.outputs.version }}"

          git push origin "${{ steps.version.outputs.version }}"

      - name: Deploy only dist files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: github-build
          force_orphan: true
          commit_message: "Production build ${{ steps.version.outputs.version }}"